:root{

  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--sans);overflow:hidden;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--void);z-index:10}

header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;

h1{font-size:17px;font-weight:700;letter-spacing:.02em;margin:0;white-space:nowrap}

.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#ctrl{display:contents}

.tb{width:100%;border-collapse:collapse;font-size:12px;line-height:1.5;margin:4px 0 6px}

.tb thead th{color:var(--ink3);font-weight:500;font-size:11px}

  #q{width:120px}

   {n:"[디직 02-02] 공동 작업을 통한 협업",note:"디지털 직업 환경에서 타인과 다양한 의견이나 자료의 공동 작업을 통해 협업할 수 있다.",ex:"디지털 직업 환경에서 타인과 공동으로 협력하여 작업하는 데 적합한 디지털 도구나기술을 선택하고, 이를 이용하여 타인과 함께 직업 생활에 필요한 디지털 자료를 공동으로 작업하여 만드는 경험을 통해 디지털 협업 역량을 기를 수 있도록 지도한다.",links:[["X2-6","i","'공동 작업을 통해 협업'이 팀 협의 및 공유에 해당"]]},
   {n:"[디직 03-01] 디지털 콘텐츠 유형 구분",note:"디지털 콘텐츠의 개념과 특징에 대해 이해하고, 다양한 유형의 디지털 콘텐츠를 구분할 수 있다.",ex:"디지털 콘텐츠의 개념과 특징 등에 대해 개괄적으로 이해하고, 나아가 다양한 유형의 디지털 콘텐츠를 구분할 수 있도록 실생활 속 사례를 바탕으로 학습 자료를 구성하여 지도한다.",links:[["X4-2","i","콘텐츠 유형 구분이 AI 생성 콘텐츠 판별의 기초"]]},
   {n:"[디직 03-02] 콘텐츠 검색·평가·활용",note:"디지털 콘텐츠를 검색·선택·열람·평가하여 다양한 직업 생활에 활용할 수 있다.",ex:"객관적이고 비판적인 관점에서 디지털 콘텐츠를 검색·선택·열람·평가하여 사운드, 이미지, 동영상, VR/AR, 슬라이드 등 여러 가지 형식의 디지털 콘텐츠를 다양한 직업 생활에서 효과적으로 활용할 수 있도록 지도한다.",links:[["X4-3","c","성취기준에 '평가', 해설에 '객관적이고 비판적인 관점'이 명시되어 근거 평가와 맞닿음(대상이 AI 산출물로 한정되지는 않음)"],["X4-2","i","사실성 확인"],["X4-5","i","자료의 신뢰성 판단"]]},
   {n:"[디직 03-03] 편집 소프트웨어로 콘텐츠 제작",note:"다양한 디지털 콘텐츠 편집 소프트웨어를 사용하여 직업 생활에 필요한 창의적인 디지털 콘텐츠를 제작할 수 있다.",ex:"디지털 콘텐츠를 편집할 수 있는 다양한 소프트웨어를 사용할 수 있도록 하며, 이를 바탕으로 직업 생활에 필요한 창의적인 디지털 콘텐츠를 제작해 봄으로써 자신의 아이디어를 디지털 방식으로 표현할 수 있도록 지도한다.",links:[["X3-4","i","편집 소프트웨어로 직접 편집·제작하는 것이 산출물 수정에 해당"]]},
   {n:"[디직 04-01] 디지털 문제 해결의 필요성",note:"직업 생활에서 디지털 기술을 활용한 문제 해결의 필요성을 이해할 수 있다.",ex:"직업 생활에서 디지털 기술을 활용한 문제 해결의 사례 탐색을 통해 디지털 문제해결의 필요성을 이해할 수 있도록 지도한다.",links:[["X1-1","i","활용 필요성 이해가 AI 활용 적합성 판단의 전제"]]},
   {n:"[디직 04-02] 직무 분석과 활용 방안 탐색",note:"디지털 기술을 활용한 문제 해결을 위해 직무를 분석하고, 디지털 기술의 활용 방안을 탐색할 수 있다.",ex:"직업 생활에서 디지털 문제 해결을 위해 직무를 분석하고, 이를 토대로 디지털 기술을 활용하여 문제를 해결하는 방안을 탐색할 수 있는 역량을 키우는 데 주안점을 두고 지도한다. 또한 직무 분석 시 업무의 자동화 요소, 직무에 사용하는 데이터의 패턴 등의 분석을 통해 향후 소프트웨어 구현을 통한 자동화로 연계할 수 있도록 지도한다. 또한 수업 운영 시 전공 일반 과목 중 ‘알고리즘 설계’ 과목과의 연계성을 고려하고, 17개 교과(군)와 관련된 직무 분야에서의 적용 사례를 탐색하는 등 연계성을 고려하여 지도한다.",links:[["X1-2","i","'직무를 분석'과 해설의 '업무의 자동화 요소, 직무에 사용하는 데이터의 패턴 등의 분석'이 맡길 부분을 가르는 과업 분해에 해당(AI 명시는 없음)"],["X1-1","i","활용 방안 탐색이 AI 활용 계획에 해당"],["X2-1","i","해결 방안 구상이 맞춤 과제 설계에 해당"]]},
   {n:"[디직 04-03] 문제 해결 방안 구현",note:"디지털 문제 해결 방안을 디지털 기술을 활용하여 구현할 수 있다.",ex:"디지털 문제 해결 방안을 디지털 기술을 활용한 소프트웨어 구현을 통해 자동화하는 과정이 직업 생활에서 효율적인 업무 처리에 도움이 될 수 있음을 학생들이 이해하고, 이러한 과정을 경험할 수 있도록 지도한다. 또한 수업 운영 시 전공 일반 과목 중 ‘프로그래밍’ 과목과의 연계성을 고려하고, 17개 교과(군)와 관련된 직무 분야에서의 적용 사례를 탐색하는 등 연계성을 고려하여 지도한다.",links:[["X2-4","i","구현이 프로그램 제작에 해당"],["X2-5","i","구현 과정의 시험 및 보완"]]},
   {n:"[디직 05-01] 인공지능의 개념과 특징",note:"인공지능의 개념과 특징을 이해할 수 있다.",ex:"다양한 인공지능 기술이 적용된 콘텐츠를 활용한 실습을 통해 학생들이 인공지능의 개념과 특징을 이해할 수 있도록 지도한다. 또한 인공지능의 이론적 접근보다는 생활 속 사례를 바탕으로 학습 자료를 구성하여 지도한다. 또한 수업 운영 시 전공 일반 과목 중 ‘인공지능 일반’과목과의 연계성을 고려하고, 17개 교과(군)와 관련된 직무 분야에서의 적용 사례를 탐색하는 등 연계성을 고려하여 지도한다.",links:[["B1","c","'인공지능의 개념과 특징'이 보편적 AI 리터러시에 직접 해당"],["B2","i","해설의 '인공지능 기술이 적용된 콘텐츠를 활용한 실습'이 AI 기본 사용에 해당"]]},
   {n:"[디직 05-02] 기계 학습 모델 구현",note:"데이터를 활용한 기계 학습을 이해하고, 기계 학습 모델을 구현할 수 있다.",ex:"데이터를 사용하는 기계 학습에 대한 이해를 바탕으로 기계 학습 모델 구현을 실습함으로써 인공지능의 생성 과정에 대해 이해할 수 있도록 지도한다. 또한 인공지능의 기계 학습에 대한 이론적 접근보다는 비교적 활용이 용이한 이미지 혹은 텍스트 데이터 등을 활용한 기계 학습 모델 구현 실습에 중점을 두고 지도하여 학생들에게 어떻게 인공지능을 생성할 수 있는지에 대한 개괄적 이해를 도울 수 있도록 지도한다. 또한 수업 운영 시 전공 실무 과목 중 ‘인공지능 모델링’ 과목과의 연계성을 고려하고, 17개 교과(군)와 관련된 직무 분야에서의 적용 사례를 탐색하는 등 연계성을 고려하여 지도한다.",links:[["X2-3","c","'데이터를 활용한 기계 학습'과 '모델을 구현', 해설의 '이미지 혹은 텍스트 데이터 등을 활용한 기계 학습 모델 구현 실습'이 AI 모델 학습에 직접 해당"],["X4-5","i","학습 데이터의 품질 점검"]]},
   {n:"[디직 05-03] 인공지능의 필요성·활용 분야",note:"직업 생활에서 인공지능의 필요성을 이해하고, 활용 분야를 탐색할 수 있다.",ex:"디지털 사회에서 인공지능으로 인하여 발생하는 직업 분야의 다양한 변화 트렌드(예: 자동화, 일하는 방식과 역할의 변화, 일자리의 생성과 소멸 등)에 대한 비교·분석 과정을 통해 직업 생활에서 인공지능이 왜 필요한지 이해할 수 있도록 지도하고, 직업 분야에서 직무를 수행하기 위해 인공지능을 어떻게 활용할 수 있는가에 대해 아이디어를 제시하거나 사례를 탐색하는 과정을 통해 직업 생활에서 인공지능의 효용성을 이해할 수 있도록 지도한다. 또한 수업 운영 시 전공 일반 과목 중 ‘인공지능 일반’ 과목과의 연계성을 고려하고, 17개 교과(군)와 관련된 직무 분야에서의 적용 사례를 탐색하는 등 연계성을 고려하여 지도한다.",links:[["X1-1","c","'인공지능의 필요성'과 '활용 분야 탐색', 해설의 '직무를 수행하기 위해 인공지능을 어떻게 활용할 수 있는가'가 AI 활용 적합성 판단·계획에 직접 해당"],["X1-2","i","해설의 '자동화, 일하는 방식과 역할의 변화' 비교·분석이 사람과 AI의 역할 배분 이해의 기초"],["B2","i","직업 생활의 AI 사용 기초"]]},
   {n:"[디직 06-01] 디지털 시민 의식",note:"디지털 시민 의식의 의미와 중요성에 대해 이해하고, 디지털 시민 의식의 구성 요소를 설명할 수 있다.",ex:"디지털 시민 의식의 의미와 중요성을 이해하고 나아가 전통적 시민 의식과의 비교를 통해 디지털 시민 의식이 갖는 특징을 보다 명확히 파악할 수 있도록 지도한다. 또한 디지털의사소통 과정 참여, 디지털 문해력, 디지털 법의 준수, 디지털 표현의 자유와 책임 등과 같은 디지털 시민 의식이 갖는 여러 가지 구성 요소에 대해 설명할 수 있도록 직업 생활 속 사례를 바탕으로 지도한다.",links:[["X5-3","i","시민 의식의 구성 요소 이해가 규범 준수의 기반"]]},
   {n:"[디직 06-02] 디지털 환경의 예절",note:"다양한 디지털 환경에 적합한 예절을 이해하고 실천할 수 있다.",ex:"사회관계망 서비스(SNS), 사회관계망 서비스(SNS) 단체 대화방, 메타버스 등과 같은 다양한 디지털 환경에서 자신의 권리를 보호하면서 타인을 존중하고 배려하는 디지털 예절에 대해 이해하여 이를 구체적으로 실천해 볼 수 있도록 함으로써 디지털 사회에서 요구하는 올바른 시민성을 갖춘 건전한 디지털 시민을 양성할 수 있도록 지도한다.",links:[["X5-3","i","예절 실천이 규범 준수에 해당"]]},
   {n:"[디직 06-03] 디지털 직업 윤리와 의사 결정",note:"디지털 시대의 직업인이 갖추어야 할 직업 윤리의 개념에 대해 설명하고, 디지털 직업 환경에서 올바른 가치관을 바탕으로 윤리적 의사 결정 및 행동을 할 수 있다.",ex:"일반적인 직업 윤리의 개념과 더불어 디지털 시대 직업인으로서 갖추어야 할 직업윤리인 디지털 정보 보호, 프라이버시 보호, 저작권 및 라이선스 등에 대해 이해할 수 있도록 지도한다. 또한 직업 윤리의 중요성을 인식할 수 있도록 디지털 직무를 수행하는 과정에서 발생할 수 있는 다양한 문제 상황을 제시하고, 이에 대해 개인적·사회적 측면에서 올바른 가치관을 바탕으로 윤리적 의사 결정 및 행동을 할 수 있도록 구체적인 직업 생활 속 사례를 활용한 학생 활동 중심으로 지도한다.",links:[["X5-3","c","'윤리적 의사 결정'이 명시되고, 해설에 '디지털 정보 보호, 프라이버시 보호, 저작권 및 라이선스'가 제시되어 윤리적 판단에 직접 해당(AI는 명시되지 않음)"],["X5-1","i","의사 결정의 실행"]]}]},
 {id:"K3",n:"성공적인 직업 생활",c:"#b4e08f",d:"2022 개정 직업계고 전문 공통 과목. 직업의 의미와 가치를 생각하고 진로 목표를 세우는 과목으로, 영역은 일과 직업, 진로 직업 설계와 직업 기초 능력, 취업과 창업, 직업 생활과 직업 윤리, 근로관계와 산업 안전, 경력 관리와 평생 학습. AI·데이터를 명시한 성취기준은 없어 성취기준 문장에 AI는 없으나 [인산 07-03] 해설에 '인공지능과 로봇의 등장'이 명시됨. 성취기준과 해설(성취기준 적용 시 고려 사항)은 확정 고시 원문(교육부 고시 제2022-33호 [별책 30], 국가교육위원회 고시 제2024-3호 일부개정 포함) 기준.",src:"gosi30",
  items:[
   {n:"[성직 02-01] 검색 도구로 진로 정보 탐색",note:"다양한 검색 도구를 활용하여 진로와 직업에 대한 정보를 탐색하여 정리할 수 있고, 자신이 탐색한 진로와 직업 분야에서 성공한 다양한 직업인을 찾아보고 그들의 성공 요인들을 분석하여 정리할 수 있으며, 자신의 흥미와 적성에 맞는 진로와 직업을 설정하여 구체적으로 미래를 설계해 보고 이를 프레젠테이션 자료로 제작하여 발표할 수 있다.",ex:"디지털 자원이나 다양한 도구 등을 활용하여 학생들이 진로와 직업에 대한 정보를 찾아볼 수 있는 정보원을 안내하여 정보를 탐색하고 내용을 정리할 수 있도록 하고, 디지털 도구 등을 활용하여 다양한 분야에서 성공한 사례들을 탐색하게 한 후 성공 요인을 추출하여 정리할 수 있도록 한다. 학생의 환경과 수업 상황에 맞는 적절한 ‘진로 직업 설계서’ 작성 양식을 제작하여 제공하도록 한다.",links:[["B1","i","검색 도구 활용"],["X4-3","i","정보 정리가 출처 확인의 기초"]]},
   {n:"[성직 02-02] 직업 기초 능력의 이해",note:"직업 기초 능력의 개념을 설명할 수 있고, 직업 기초 능력과 하위 능력을 종류별로 구분하여 설명할 수 있다.",ex:"직업 기초 능력 10가지와 각각의 하위 개념을 구분할 수 있도록 지도한다.",links:[["B3","i","직업 기초 능력(현 직업공통능력)이 직무 수행 기초 역량에 해당"]]},
   {n:"[성직 02-03] 직업 기초 능력 향상 방법",note:"직업 기초 능력이 성공적인 직업 생활에 미치는 영향을 설명할 수 있고, 성공적인 직업 생활을 위한 효과적인 직업 기초 능력 향상 방법을 탐색할 수 있다.",ex:"직업 기초 능력에 대한 교수·학습의 경우 사례 중심으로 계획하고 다양한 활동 등을 통하여 성취기준에 효과적으로 도달하도록 지도한다.",links:[["B3","i","직무 수행 기초"],["X5-5","i","향상 방법 탐색이 개선에 해당"]]},
   {n:"[성직 04-03] 직업 윤리",note:"직업 윤리의 개념에 대하여 설명할 수 있고, 직업 윤리와 사회 윤리와의 관계를 설명할 수 있다.",ex:"직업 생활에서 발생할 수 있는 윤리적 문제와 쟁점들에 대한 상황을 설정하고, 이를 개인과 사회 윤리적 측면에서 해결하기 위한 방안과 이를 실천할 수 있는 구체적인 실행 계획을 수립해 볼 수 있도록 한다.",links:[["X5-3","i","직업 윤리가 윤리적 판단의 기반"]]},
   {n:"[성직 05-01] 근로 관련 법과 권익 보호",note:"근로 관련 법의 기본 원리를 설명할 수 있고, ｢근로 기준법｣에 따른 근로 계약 체결의 의미를 설명할 수 있으며, 근로 계약 관계에서 권익의 침해와 차별이 발생되었을 때 해결 방법을 설명할 수 있다.",ex:"근로 관련 법의 의미와 목적을 이해할 수 있도록 안내하고, 피고용인들의 기본 생활보장과 보호받아야 할 권리에 대하여 이해할 수 있도록 안내하고, 직업 생활 현장에서 당면하게되는 다양한 사례를 토대로 해결 과정을 서로 토의하고 토론하면서 결론에 이를 수 있도록 교수·학습을 계획하여 운영한다.",links:[["X5-3","i","법 원리와 차별 대응이 법·규제 준수와 공정성에 해당"]]},
   {n:"[성직 05-04] 안전사고 예방과 산업 재해 처리",note:"안전사고의 형태와 원인을 알고 안전 수칙 및 사고 형태별 안전 대책을 수립할 수 있고, 산업 재해의 개념을 알고 예방 원칙과 대책을 수립할 수 있으며, 산업 재해의 종류를 알고 산업 재해 처리 방법을 제시할 수 있다.",ex:"산업 안전과 재해 예방 교육을 위해 산업 현장이나 학교 현장에서 발생하고 있는 사례들을 조사하여 소개함으로써 학생의 이해도를 높이고 안전의 중요성을 깨달을 수 있도록 지도한다.",links:[["X4-4","i","원인 파악과 대책 수립이 적용 위험 식별에 해당"],["X5-4","i","처리 방법이 시정 조치에 해당"]]},
   {n:"[성직 06-01] 경력 관리와 개발",note:"경력의 의미에 대하여 설명할 수 있고, 경력 관리의 중요성과 경력 개발 방법에 대하여 설명할 수 있다.",ex:"경력 관리의 의미와 중요성을 평생 교육의 측면에서 설명할 수 있도록 교수·학습을 계획하고 적용하고, 학생이 스스로 자신의 경력 개발 경로를 설정하여 평생에 걸쳐 경력을 관리하고 개발할 수 있는 방법에 대하여 안내하도록 한다.",links:[["X5-5","i","경력 개발이 성찰 및 개선에 해당"]]},
   {n:"[성직 06-03] 직업 세계 변화 예측",note:"과거로부터 현재까지의 직업 세계 변화 동향과 특징을 조사하고 설명할 수 있고, 미래 사회 변화와 그에 따른 직업 세계의 변화를 예측하고 대처 방법을 모색해 볼 수 있다.",ex:"과거로부터 현재에 이르기까지 직업 생활이 어떻게 변화해 왔는가를 탐색해 보도록하고, 새롭게 탄생하거나 소멸되는 직업들을 탐색해 보면서 미래의 직업 세계 변화를 예측해 볼수 있도록 하며, 이러한 과정들을 통하여 직업 세계의 변화에 대처해 볼 수 있는 예비 직업인들이 될 수 있도록 지도한다.",links:[["B1","i","기술 변화에 따른 직업 세계 이해"]]}]},
 {id:"K4",n:"노동 인권과 산업 안전 보건",c:"#ffc58f",d:"2022 개정 직업계고 전문 공통 과목. 노동의 의미와 노동 기본권, 산업 안전 보건을 다루는 과목으로, 영역은 노동과 인간의 존엄, 노동 인권의 보장, 다양한 노동과 노동 인권, 산업 안전 일반, 사고 예방의 이해, 안전한 작업 방법, 노동 인권 실천과 사회 참여. 성취기준 문장에 AI는 없으나 [인산 07-03] 해설에 '인공지능과 로봇의 등장'이 명시됨. 성취기준과 해설(성취기준 적용 시 고려 사항)은 확정 고시 원문(교육부 고시 제2022-33호 [별책 30], 국가교육위원회 고시 제2024-3호 일부개정 포함) 기준.",src:"gosi30",
  items:[
   {n:"[인산 03-01] 플랫폼 노동 등 다양한 고용 형태",note:"노동 시장 유연화의 증대에 따른 비정규 노동과 플랫폼 노동 등 다양한 고용 형태에 대한 이해와 쟁점을 토론할 수 있다.",ex:"노동 시장 유연화가 증대되면서 확대되는 프리랜서 등 다양한 비정규 노동을 비롯해 디지털 기술의 발달로 인해 새롭게 등장하는 긱 노동(Gig work), 플랫폼 노동의 실태를 파악하여 고용 형태 다양화가 노동 현실에 미치는 영향과 쟁점에 대해 설명할 수 있도록 지도하고, 기존 노동법의 적용을 받지 못하는 새로운 형태의 노동자를 보호하기 위한 사회적 대안을 모색하기 위해 토론할 수 있도록 한다.",links:[["B1","i","해설의 '디지털 기술의 발달로 인해 새롭게 등장하는 긱 노동, 플랫폼 노동'이 디지털 기반 노동 변화의 이해에 해당(AI 명시는 없음)"]]},
   {n:"[인산 03-02] 차별적 요소의 원인 분석",note:"노동 시장 내 다양한 노동의 실태를 파악하고, 차별적 요소의 원인을 분석하여 발표할 수 있다.",ex:"노동 시장 내 성차별 실태 및 평등할 권리를 파악하고 일·생활 균형 방안을 모색하며, 아동·청소년 노동과 노인 노동 등 연령에 따른 노동 환경 실태 및 장애인 노동과 이주 노동 등 다양한 노동의 실태를 이해하고, 차별적 요소와 원인을 분석하여 해결 방안을 논의할 수 있도록 지도한다.",links:[["X4-2","i","차별 원인 분석이 편향 분석과 맞닿음"],["X5-3","i","공정성 확보"]]},
   {n:"[인산 04-03] 산업안전보건법과 주체별 의무",note:"「산업 안전 보건법」(규칙)을 통해 주체별 의무와 권리를 이해하고 법의 필요성을 설명할 수 있다.",ex:"「산업 안전 보건법」(규칙)에서 정하는 주체별(근로자, 사업주) 의무와 권리를 이해하고 현장에서의 안전한 행동 요령에 적용할 수 있는 법과 규칙에 대해 알아보고 설명할 수 있도록 지도한다.",links:[["X5-3","i","법·규제 준수"],["X5-2","i","'주체별 의무'가 책임 소재 명시에 해당"]]},
   {n:"[인산 05-01] 사고 원인과 위험성",note:"사고 발생의 주요 원인 및 형태에 대해 이해하고 전반적인 위험성을 설명할 수 있다.",ex:"사고가 일어나는 주요 업종·형태·기인물(원인이 되는 기계·기구 등)에 대한 각 업종별 구체적 사례를 제시하여 이에 대한 위험성을 인지할 수 있도록 지도한다.",links:[["X4-4","i","위험성 설명이 적용 위험 식별에 해당"]]},
   {n:"[인산 05-03] 작업 현장 위험성 평가",note:"작업 현장 위험성 평가의 개념을 이해하고, 이를 활용한 예방 대책과 작업 방법에 대해 설명할 수 있다.",ex:"위험성 평가의 개념·실행 및 절차·적용과 이행 방법에 대한 구체적인 사례를 제시하여 이해를 돕고, 이를 바탕으로 현장에서 안전한 작업 방법을 선택할 수 있도록 지도한다.",links:[["X4-4","i","위험성 평가"],["X4-1","i","현장 기준에 따른 판단"],["X5-4","i","예방 대책"]]},
   {n:"[인산 06-01] 업종별 안전한 작업 방법",note:"업종별 작업의 특성을 고려한 안전한 작업 방법을 선택할 수 있다.",ex:"각 업종별 특성에 따른 안전 보건 관리 환경과 주요 업종의 유해·위험 요인에 대해 이해하고 이를 연계하여 현장에서 안전한 작업 방법을 선택할 수 있도록 지도한다.",links:[["X4-1","i","업종별 현장 기준에 따른 판단"]]},
   {n:"[인산 06-02] 위험 기계·설비의 위험 요소",note:"위험 기계·기구 등 설비의 위험 요소를 파악하고 안전한 작업 방법을 선택할 수 있다.",ex:"현장에서의 설비별 위험 요소와 안전 수칙, 각 업종별 사고가 자주 발생하는 기계·기구·시설·장비에 중점을 두고 지도한다.",links:[["X4-4","i","'위험 기계·기구 등 설비의 위험 요소를 파악'과 해설의 '설비별 위험 요소'가 장비 작동 특성에 따른 적용 위험 식별과 맞닿음"],["X3-1","i","설비 위험 요소 파악이 자율 장비 상태 점검의 기초"]]},
   {n:"[인산 06-03] 안전 수칙과 근로자 보호",note:"안전 수칙·표지·보호구 등 근로자 보호 대책에 대해 설명할 수 있다.",ex:"안전 수칙에 대한 준수 사항, 안전표지에 대한 이해와 표기 및 주지 방법, 반드시 필요한 보호구의 착용 방법, 위험 요소 발견 시 대처 요령 등에 대하여 지도한다.",links:[["X5-3","i","안전 수칙 준수"]]},
   {n:"[인산 07-03] 디지털 혁명과 노동의 변화",note:"디지털 혁명으로 인한 미래 사회의 노동의 변화를 탐색하고, 기후위기 극복과 불평등 해소를 포함한 노동 존중 사회를 상상하고 실천 방안에 대해 토론할 수 있다.",ex:"디지털 환경의 변화, 그리고 인공지능과 로봇의 등장에 따른 노동 세계의 변화와 연결하여 이해할 수 있도록 하며, 불평등 심화의 위험성을 인식하고 인간 존엄 관점에서 대안을 모색할 수 있도록 한다. 또한 탄소 중립 등 기후위기에 대한 노사의 바람직한 태도에 대해 고민하고 ‘정의로운 전환’의 의미를 이해하며 미디어 등에 나타난 현실 쟁점에 대한 비판적 사고 능력을 함양할 수 있도록 한다.",links:[["B1","c","해설에 '인공지능과 로봇의 등장에 따른 노동 세계의 변화'가 명시되어 AI의 사회적 영향 이해에 직접 해당"],["X5-3","i","해설의 '불평등 심화의 위험성을 인식하고 인간 존엄 관점에서 대안을 모색'이 공정성·윤리적 판단과 맞닿음"]]}]},
